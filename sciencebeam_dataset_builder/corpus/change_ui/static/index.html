<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corpus change requests</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <h1>Corpus change requests</h1>
      <p id="who" class="who" aria-live="polite">Checking who you are…</p>
    </div>
  </header>
  <main class="wrap">
    <ol class="steps" id="steps" aria-label="Progress">
      <li data-step="type">Change type</li>
      <li data-step="documents">Documents</li>
      <li data-step="reasons">Reasons</li>
      <li data-step="review">Check and review</li>
      <li data-step="done">Submitted</li>
    </ol>
    <div id="banner" class="banner" role="alert" hidden></div>
    <section id="view" class="card" aria-live="polite"></section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
