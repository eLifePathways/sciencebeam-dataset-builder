[project]
name = "sciencebeam-dataset-builder"
version = "0.0.0"
description = "ScienceBeam Dataset Builder"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ftfy>=6.0",
    "huggingface-hub[cli]>=0.27",
    "pandas>=2.0",
    "pyarrow>=19.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.67.3",
]

[project.scripts]
sciencebeam-dataset-builder = "sciencebeam_dataset_builder.scielo_preprints.retrieve_cli:main"

[tool.ruff]
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["tests.*", "tests.*.*", "notebooks.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "datasets>=3.0",
    "mypy>=1.15",
    "pandas-stubs>=3.0.0.260204",
    "pylint>=4.0.8",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
    "types-pyyaml>=6.0",
    "types-requests>=2.32.4.20260324",
    "types-tqdm>=4.67.3.20260303",
]

[tool.pylint.main]
# Tests are not linted, matching the mypy scope above.
ignore-paths = ["tests/.*"]
# pyarrow.compute builds its members at import time, so pylint sees none of them.
ignored-modules = ["pyarrow.compute"]

[tool.pylint."messages control"]
# Ruff owns formatting and import order; pylint is here for the logic checks.
# The size and docstring families are off because this codebase is deliberately
# terse and its CLIs are long by nature, and duplicate-code fires on the argparse
# boilerplate the sibling CLIs share on purpose.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "duplicate-code",
    "too-many-locals",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "too-many-instance-attributes",
    "import-outside-toplevel",
    "line-too-long",
    "wrong-import-order",
    "ungrouped-imports",
    # Deliberate in the retry and upload paths, and in the notebook scripts.
    "broad-exception-caught",
    "unused-argument",
    "consider-using-with",
    "redefined-outer-name",
]
